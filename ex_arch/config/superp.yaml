device: cpu


dynamics:
  systemName: system_arch
  f_x:
    - x1 - x1 ** 3 + v1 * x2 - x1 * x2 ** 2 + u1
    - -x1 + v1 * x2 - x1 ** 2 * x2 - x2 ** 3 + u2

  x_var_str: x1, x2
  col_var_str: u1, u2
  random_var_str: v1

  x_var_num: 2
  col_var_num: 2
  random_var_num: 1

  var_num: 5
  # dt
  alpha: 0.001
  goal: avoid
  max_episode: 1000


  col_bound: 0.005
# ----------------------------------- #





# ---------------SBC--------------- #
Bx_model:
  type: poly
  input_dim: 2
  output_dim: 1


  deg: 6


  lambda: -1

  mathcal_H: 3

  rho: 0.1
# ----------------------------------------- #



# -------------------SCP_N------------------- #
SCP_N:
  G_r: -1
  beta: 0.005
  epsilon: 0.0174
  N: -1


# ---------------SCP_N_hat_N--------------- #
SCP_N_hat_N:

  hat_N: 500


  beta_s: -1


  hat_M: -1


  d: -1


  delta: 0.05


  miu: 0.008

# ------------------------------------ #



# ---------------------------- #
save_load:
  #NN
  save_path: results/{model_type}.{state}.pth
  load_path: results/{model_type}.{state}.pth

  #poly
  poly_save_path: results/{model_type}.{state}.txt
  poly_load_path: results/{model_type}.{state}.txt

# ------------------------------------ #
